<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Monochromatic Brightness Verification</title>
</head>
<body>
  <pre id="result">pending</pre>
  <iframe
    id="appFrame"
    src="/index.html"
    style="width: 1440px; height: 2200px; border: 0;"
  ></iframe>

  <script>
    (function runVerification() {
      const frame = document.getElementById("appFrame");
      const result = document.getElementById("result");

      function sleep(ms) {
        return new Promise((resolve) => {
          window.setTimeout(resolve, ms);
        });
      }

      function readPalette(doc) {
        return Array.from(doc.querySelectorAll("#palette .color-card .color-label"))
          .map((label) => label.textContent.trim());
      }

      async function setBrightness(doc, value) {
        const input = doc.getElementById("brightness");
        input.value = String(value);
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await sleep(500);
      }

      frame.addEventListener("load", async () => {
        const doc = frame.contentDocument;
        const monochromaticOption = doc.querySelector('input[name="paletteType"][value="monochromatic"]');

        await sleep(700);

        monochromaticOption.checked = true;
        monochromaticOption.dispatchEvent(new Event("change", { bubbles: true }));
        await sleep(700);

        await setBrightness(doc, 0);
        const lowBrightnessPalette = readPalette(doc);

        await setBrightness(doc, 100);
        const highBrightnessPalette = readPalette(doc);

        const verification = {
          lowBrightnessPalette,
          highBrightnessPalette,
          palettesDiffer: lowBrightnessPalette.join("|") !== highBrightnessPalette.join("|"),
          lastColorDiffers:
            lowBrightnessPalette[lowBrightnessPalette.length - 1] !==
            highBrightnessPalette[highBrightnessPalette.length - 1],
        };

        document.body.dataset.palettesDiffer = String(verification.palettesDiffer);
        document.body.dataset.lastColorDiffers = String(verification.lastColorDiffers);
        result.textContent = JSON.stringify(verification, null, 2);
      }, { once: true });
    })();
  </script>
</body>
</html>
